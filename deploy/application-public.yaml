apiVersion: v1
kind: Service
metadata:
  name: frontend-public
  namespace: k6-lab
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: ecommerce-frontend
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-public
  namespace: k6-lab
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: ecommerce-backend
  ports:
    - {name: http, port: 3000, targetPort: http}
