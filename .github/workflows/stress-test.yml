name: Stress Test

on:
  workflow_dispatch:
    inputs:
      quick_check:
        description: Cek pipeline singkat sebelum menjalankan tes penuh
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  performance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: coquette-lab-performance
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/performance
        with:
          profile: stress
          quick_check: ${{ inputs.quick_check }}
          base_url: ${{ vars.LAB_BASE_URL || 'http://20.212.106.179:8080' }}
