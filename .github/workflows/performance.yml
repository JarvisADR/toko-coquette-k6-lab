name: Run performance test

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      quick_check:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: coquette-lab-performance
      cancel-in-progress: false
    env:
      LAB_BASE_URL: ${{ vars.LAB_BASE_URL || 'http://20.212.106.179:8080' }}
      QUICK_CHECK: ${{ inputs.quick_check }}
      TEST_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Pull k6
        run: |
          if [ "$TEST_PROFILE" = browser ]; then
            docker pull grafana/k6:2.3.0-with-browser
          else
            docker pull grafana/k6:2.3.0
          fi
      - name: Run k6
        run: node tests/actions/run.mjs "$TEST_PROFILE"
      - name: Generate Apache JMeter dashboard
        if: ${{ always() && !cancelled() && hashFiles('results/run.json') != '' }}
        run: bash tests/actions/jmeter.sh
      - name: Upload dashboard and samples
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: jmeter-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            results/jmeter/
            results/samples.csv
            results/run.json
            results/stage-*.log
          if-no-files-found: error
          retention-days: 14
