name: Performance test and JMeter dashboard
description: Run a k6 profile and upload the Apache JMeter dashboard.

inputs:
  profile:
    description: load, stress, or browser
    required: true
  quick_check:
    description: Run a short pipeline check
    default: 'false'
  base_url:
    description: Public origin of the lab application
    required: true

runs:
  using: composite
  steps:
    - name: Pull k6
      shell: bash
      env:
        TEST_PROFILE: ${{ inputs.profile }}
      run: |
        if [ "$TEST_PROFILE" = browser ]; then
          docker pull grafana/k6:2.3.0-with-browser
        else
          docker pull grafana/k6:2.3.0
        fi
    - name: Run k6
      shell: bash
      env:
        LAB_BASE_URL: ${{ inputs.base_url }}
        QUICK_CHECK: ${{ inputs.quick_check }}
        TEST_PROFILE: ${{ inputs.profile }}
      run: node tests/actions/run.mjs "$TEST_PROFILE"
    - name: Generate Apache JMeter dashboard
      if: ${{ always() && !cancelled() && hashFiles('results/run.json') != '' }}
      shell: bash
      run: bash tests/actions/jmeter.sh
    - name: Upload dashboard and samples
      if: ${{ always() && !cancelled() }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: jmeter-${{ inputs.profile }}-${{ github.run_id }}
        path: |
          results/jmeter/
          results/samples.csv
          results/run.json
          results/stage-*.log
        if-no-files-found: error
        retention-days: 14
